<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Task Analyzer</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="hero-bg"></div>

<div class="container fade-in">
    <h1 class="title">⚡ Smart Task Analyzer</h1>
    <p class="subtitle">Let AI organize your day with smart scoring & priority rankings</p>

    <!-- Add Task Card -->
    <div class="glass card fade-in-up">
        <h3>Add Task</h3>
        <input id="title" placeholder="Task Title">
        <input id="due" type="date">
        <input id="hours" type="number" min="0" step="0.5" placeholder="Estimated Hours">
        <input id="importance" type="number" min="1" max="10" placeholder="Importance 1–10">
        <input id="taskid" placeholder="Task ID (optional)">
        <input id="deps" placeholder="Dependencies (comma separated)">
        <button class="btn" onclick="addTask()">➕ Add Task</button>
    </div>

    <!-- Strategy Section -->
    <div class="glass card fade-in-up">
        <h3>Strategy</h3>
        <select id="strategy">
            <option value="smart_balance">Smart Balance</option>
            <option value="fastest_wins">Fastest Wins</option>
            <option value="high_impact">High Impact</option>
            <option value="deadline_driven">Deadline Driven</option>
        </select>

        <div class="btn-row">
            <button class="btn" onclick="analyze()">📊 Analyze Tasks</button>
            <button class="btn alt" onclick="suggest()">⭐ Top 3</button>
        </div>

        <p id="status"></p>
        <div id="results"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
